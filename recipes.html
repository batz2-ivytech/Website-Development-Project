
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dinner Ideas | Atz Family Hub</title>
  <meta name="description" content="Family dinner ideas and recipes, with links to full instructions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&family=Oswald&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
    <img src="images/logo.png" alt="Atz Family Hub logo" class="logo">
    </a>
    <h1><a href="index.html">Atz Family Hub</a></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="schedule.html">School Schedule</a>
      <a href="recipes.html">Dinner Ideas</a>
      <a href="lunch-menu.html">School Lunch Menu</a>
      <a href="gallery.html">Photo Gallery</a>
    </nav>

  <main>
    <h2>Dinner Ideas</h2>
    <ul id="recipe-list" class="corkboard">
      <!-- recipe cards get inserted here -->
    </ul>

    <h2>Add a Recipe</h2>
    <form id="add-recipe-form">
      <label for="recipe-name">Recipe name</label>
      <input type="text" id="recipe-name" required>

      <label for="recipe-link">Link (optional)</label>
      <input type="url" id="recipe-link">

      <button type="submit">Add recipe</button>
    </form>
    <p id="form-message" class="form-message"></p>
  </main>

  <script src="recipes.js" defer></script>
</body>
</html>
